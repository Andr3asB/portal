<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<title>Später – geparkte Aufgaben</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&amp;family=Bricolage+Grotesque:wght@600;800&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;font-family:'Atkinson Hyperlegible',Verdana,sans-serif;background:#F6F3EC;color:#1F2A2E}
button,input{font-family:inherit}
button{cursor:pointer}
a{color:#1F5F5B}a:hover{color:#123F3C}
</style>
</helmet>
<div style="width: 390px; height: 1200px; box-sizing: border-box; background: #F6F3EC; display: flex; flex-direction: column;">

<header style="background: {{kopfFarbe}}; color: #ffffff; padding: 16px 12px; display: flex; align-items: center; gap: 8px;">
<sc-if value="{{istEltern}}" hint-placeholder-val="{{ true }}">
<a href="Familie.dc.html" aria-label="Zurück" style="flex-shrink: 0; width: 48px; height: 48px; border-radius: 24px; background: rgba(0,0,0,0.25); display: flex; align-items: center; justify-content: center;">
<svg width="20" height="20" viewBox="0 0 20 20" fill="none" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M13 4l-6 6 6 6"></path></svg>
</a>
</sc-if>
<div style="display: flex; flex-direction: column; gap: 2px;">
<h1 style="margin: 0; font-family: 'Bricolage Grotesque', sans-serif; font-weight: 800; font-size: 26px; line-height: 1.1;">Später</h1>
<div style="font-size: 14px; opacity: 0.9;">{{kopfText}}</div>
</div>
</header>

<main style="flex-grow: 1; padding: 20px 16px; display: flex; flex-direction: column; gap: 22px;">

<section style="display: flex; flex-direction: column; gap: 8px;">
<label for="s-neu" style="font-size: 15px; font-weight: 700;">Schnell parken</label>
<div style="display: flex; gap: 8px;">
<input id="s-neu" type="text" placeholder="Was fällt dir gerade ein?" style="flex-grow: 1; min-width: 0; height: 52px; box-sizing: border-box; border-radius: 12px; border: 2px solid #8A8472; background: #ffffff; font-size: 17px; padding: 0 12px;">
<button aria-label="Parken" style="flex-shrink: 0; width: 52px; height: 52px; border-radius: 12px; border: none; background: #1F5F5B; color: #ffffff; font-size: 26px;">+</button>
</div>
<div style="font-size: 14px; color: #4A5558;">Ohne Tag, ohne Frist. Zählt nicht als offen.</div>
</section>

<sc-if value="{{hatGeholt}}" hint-placeholder-val="{{ false }}">
<section style="display: flex; flex-direction: column; gap: 8px;">
<h2 style="margin: 0; font-family: 'Bricolage Grotesque', sans-serif; font-weight: 800; font-size: 18px;">Gerade hervorgeholt</h2>
<sc-for list="{{geholt}}" as="g" hint-placeholder-count="1">
<div style="display: flex; align-items: center; gap: 10px; min-height: 60px; padding: 6px 8px 6px 14px; border-radius: 14px; background: #E6F1EF; border: 2px solid #B9D6D2;">
<span style="flex-grow: 1; display: flex; flex-direction: column; gap: 2px;"><span style="font-size: 17px; font-weight: 700;">{{g.name}}</span><span style="font-size: 14px; color: #123F3C;">{{g.wohin}}</span></span>
<button onClick="{{g.parken}}" style="flex-shrink: 0; min-height: 44px; padding: 0 14px; border-radius: 12px; border: 2px solid #1F5F5B; background: #ffffff; color: #123F3C; font-size: 15px; font-weight: 700;">Parken</button>
</div>
</sc-for>
</section>
</sc-if>

<section style="display: flex; flex-direction: column; gap: 8px;">
<div style="display: flex; justify-content: space-between; align-items: baseline;">
<h2 style="margin: 0; font-family: 'Bricolage Grotesque', sans-serif; font-weight: 800; font-size: 18px;">Geparkt</h2>
<div style="font-size: 14px; color: #4A5558;">Wichtigstes oben, am Griff ziehen</div>
</div>

<sc-for list="{{geparkt}}" as="a" hint-placeholder-count="5">
<div style="display: flex; flex-direction: column; gap: 10px; padding: 8px 8px 8px 4px; border-radius: 14px; background: #ffffff; border: 1px solid #D9D3C4;">
<div style="display: flex; align-items: center; gap: 6px; min-height: 48px;">
<button aria-label="Verschieben" style="flex-shrink: 0; width: 44px; height: 44px; border: none; background: #ffffff; display: flex; align-items: center; justify-content: center;">
<svg width="18" height="22" viewBox="0 0 18 22" fill="#8A8472" aria-hidden="true"><circle cx="5" cy="4" r="2"></circle><circle cx="13" cy="4" r="2"></circle><circle cx="5" cy="11" r="2"></circle><circle cx="13" cy="11" r="2"></circle><circle cx="5" cy="18" r="2"></circle><circle cx="13" cy="18" r="2"></circle></svg>
</button>
<span style="flex-grow: 1; display: flex; flex-direction: column; gap: 2px;"><span style="font-size: 17px; font-weight: 700;">{{a.name}}</span><span style="font-size: 14px; color: #4A5558;">{{a.seit}}</span></span>
<button onClick="{{a.auf}}" aria-expanded="{{a.offen}}" style="flex-shrink: 0; min-height: 44px; padding: 0 12px; border-radius: 12px; border: none; background: {{a.knopfBg}}; color: {{a.knopfFg}}; font-size: 15px; font-weight: 700;">{{a.knopfText}}</button>
</div>
<sc-if value="{{a.offen}}" hint-placeholder-val="{{ false }}">
<div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; padding: 0 4px 4px 8px;">
<button onClick="{{a.heute}}" style="min-height: 48px; border-radius: 12px; border: 2px solid #1F5F5B; background: #DDEBE9; color: #123F3C; font-size: 15px; font-weight: 700;">Heute</button>
<button onClick="{{a.woche}}" style="min-height: 48px; border-radius: 12px; border: 2px solid #1F5F5B; background: #DDEBE9; color: #123F3C; font-size: 15px; font-weight: 700;">Diese Woche</button>
<button onClick="{{a.tag}}" style="min-height: 48px; border-radius: 12px; border: 2px solid #1F5F5B; background: #DDEBE9; color: #123F3C; font-size: 15px; font-weight: 700;">Tag wählen</button>
</div>
</sc-if>
</div>
</sc-for>
</section>



</main>

<sc-if value="{{istEltern}}" hint-placeholder-val="{{ true }}">
<nav aria-label="Ansichten" style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 0px; background: #ffffff; border-top: 1px solid #D9D3C4; padding: 8px 8px 14px;">
<a href="Main.dc.html" style="min-height: 48px; display: flex; align-items: center; justify-content: center; border-radius: 14px; color: #1F2A2E; font-size: 16px; text-decoration: none;">Heute</a>
<a href="Woche.dc.html" style="min-height: 48px; display: flex; align-items: center; justify-content: center; border-radius: 14px; color: #1F2A2E; font-size: 16px; text-decoration: none;">Woche</a>
<a href="Familie.dc.html" aria-current="page" style="min-height: 48px; display: flex; align-items: center; justify-content: center; border-radius: 14px; background: #DDEBE9; color: #123F3C; font-weight: 700; font-size: 16px; text-decoration: none;">Familie</a>
</nav>
</sc-if>
<sc-if value="{{istKind}}" hint-placeholder-val="{{ false }}">
<nav aria-label="Ansichten" style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 0px; background: #ffffff; border-top: 1px solid #D9D3C4; padding: 8px 8px 14px;">
<a href="Main.dc.html" style="min-height: 48px; display: flex; align-items: center; justify-content: center; border-radius: 14px; color: #1F2A2E; font-size: 16px; text-decoration: none;">Heute</a>
<a href="Woche.dc.html" style="min-height: 48px; display: flex; align-items: center; justify-content: center; border-radius: 14px; color: #1F2A2E; font-size: 16px; text-decoration: none;">Woche</a>
<a href="SpaeterKind.dc.html" aria-current="page" style="min-height: 48px; display: flex; align-items: center; justify-content: center; border-radius: 14px; background: #DDEBE9; color: #123F3C; font-weight: 700; font-size: 16px; text-decoration: none;">Später</a>
</nav>
</sc-if>

</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"ansicht":{"editor":"enum","options":["Eltern","Kind"],"default":"Eltern"},"$preview":{"width":390,"height":1200}}'>
class Component extends DCLogic {
renderVals() {
const st = this.state || {};
const offenId = st.offenId || 0;
const ziel = st.ziel || {};
const eltern = (this.props.ansicht ?? 'Eltern') === 'Eltern';
const roh = !eltern ? [
{ id: 1, name: 'Vokabeln Unit 2 lernen', seit: 'Geparkt seit heute' },
{ id: 2, name: 'Schreibtisch ausmisten', seit: 'Geparkt seit 2 Wochen' },
{ id: 3, name: 'Fahrrad putzen', seit: 'Geparkt seit 4 Tagen' }
] : [
{ id: 1, name: 'Gartentor reparieren', seit: 'Geparkt seit 3 Wochen' },
{ id: 2, name: 'Fahrradschlauch flicken', seit: 'Geparkt seit 5 Tagen' },
{ id: 3, name: 'Regal im Keller aufbauen', seit: 'Geparkt seit 2 Monaten' },
{ id: 4, name: 'Dachrinne reinigen', seit: 'Geparkt seit gestern' },
{ id: 5, name: 'Fotos 2025 sortieren', seit: 'Geparkt seit 6 Wochen' }
];
const setze = (id, text) => () => this.setState({ offenId: 0, ziel: Object.assign({}, ziel, { [id]: text }) });
const geparkt = roh.filter((a) => !ziel[a.id]).map((a) => {
const offen = offenId === a.id;
return {
name: a.name, seit: a.seit, offen: offen,
knopfText: offen ? 'Schließen' : 'Hervorholen',
knopfBg: offen ? '#E9E4D6' : '#1F5F5B',
knopfFg: offen ? '#1F2A2E' : '#ffffff',
auf: () => this.setState({ offenId: offen ? 0 : a.id }),
heute: setze(a.id, 'Steht jetzt bei Heute'),
woche: setze(a.id, 'Diese Woche, ohne festen Tag'),
tag: setze(a.id, 'Donnerstag, 24.9.')
};
});
const geholt = roh.filter((a) => ziel[a.id]).map((a) => ({
name: a.name, wohin: ziel[a.id],
parken: () => this.setState({ ziel: Object.assign({}, ziel, { [a.id]: '' }) })
}));
return {
geparkt: geparkt,
geholt: geholt,
hatGeholt: geholt.length > 0,
istEltern: eltern, istKind: !eltern,
kopfFarbe: eltern ? '#1F5F5B' : '#8A2F5C',
kopfText: geparkt.length + ' geparkt · nur für dich sichtbar'
};
}
}
</script>
</body>
</html>
