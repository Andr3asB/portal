<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<title>Alle Aufgaben</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&amp;family=Bricolage+Grotesque:wght@600;800&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;font-family:'Atkinson Hyperlegible',Verdana,sans-serif;background:#F6F3EC;color:#1F2A2E}
button,input{font-family:inherit}
button{cursor:pointer}
a{color:#1F5F5B}a:hover{color:#123F3C}
</style>
</helmet>
<div style="width: 390px; height: 1200px; box-sizing: border-box; background: #F6F3EC; display: flex; flex-direction: column;">

<header style="background: #1F5F5B; color: #ffffff; padding: 16px 12px; display: flex; align-items: center; gap: 8px;">
<a href="Familie.dc.html" aria-label="Zurück" style="flex-shrink: 0; width: 48px; height: 48px; border-radius: 24px; background: #174A47; display: flex; align-items: center; justify-content: center;">
<svg width="20" height="20" viewBox="0 0 20 20" fill="none" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M13 4l-6 6 6 6"></path></svg>
</a>
<div style="display: flex; flex-direction: column; gap: 2px;">
<h1 style="margin: 0; font-family: 'Bricolage Grotesque', sans-serif; font-weight: 800; font-size: 26px; line-height: 1.1;">Alle Aufgaben</h1>
<div style="font-size: 14px; opacity: 0.9;">Antippen zum Ändern</div>
</div>
</header>

<main style="flex-grow: 1; padding: 16px; display: flex; flex-direction: column; gap: 16px;">

<div style="display: flex; flex-direction: column; gap: 6px;">
<label for="a-suche" style="font-size: 15px; font-weight: 700;">Suchen</label>
<input id="a-suche" type="search" placeholder="z. B. Spülmaschine" style="height: 52px; box-sizing: border-box; border-radius: 12px; border: 2px solid #8A8472; background: #ffffff; font-size: 17px; padding: 0 12px; width: 100%;">
</div>

<div style="display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 6px;">
<sc-for list="{{filter}}" as="f" hint-placeholder-count="4">
<button onClick="{{f.waehlen}}" aria-pressed="{{f.aktiv}}" style="min-height: 48px; padding: 0 2px; border-radius: 12px; border: 2px solid {{f.rand}}; background: {{f.bg}}; color: {{f.fg}}; font-size: 14px; font-weight: 700;">{{f.name}}</button>
</sc-for>
</div>

<div style="display: flex; flex-direction: column; gap: 8px;">
<sc-for list="{{liste}}" as="a" hint-placeholder-count="8">
<a href="NeueAufgabe.dc.html" style="display: flex; align-items: center; gap: 10px; min-height: 68px; padding: 8px 10px 8px 14px; border-radius: 14px; background: #ffffff; border: 1px solid #D9D3C4; color: #1F2A2E; text-decoration: none;">
<span style="flex-grow: 1; min-width: 0; display: flex; flex-direction: column; gap: 3px;">
<span style="font-size: 17px; font-weight: 700;">{{a.name}}</span>
<span style="display: flex; flex-wrap: wrap; align-items: center; gap: 6px; font-size: 14px; color: #4A5558;">
<span>{{a.wann}} · {{a.wer}}</span>
<sc-if value="{{a.hatSicht}}" hint-placeholder-val="{{ false }}">
<span style="display: flex; align-items: center; gap: 4px; font-weight: 700; color: #1F2A2E; background: #E9E4D6; padding: 2px 8px; border-radius: 10px;">
<svg width="12" height="14" viewBox="0 0 14 16" fill="none" stroke="#1F2A2E" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="1.5" y="7" width="11" height="8" rx="2"></rect><path d="M4 7V4.5a3 3 0 0 1 6 0V7"></path></svg>
<span>{{a.sicht}}</span>
</span>
</sc-if>
<sc-if value="{{a.kachel}}" hint-placeholder-val="{{ false }}">
<span style="font-weight: 700; color: #123F3C; background: #DDEBE9; padding: 2px 8px; border-radius: 10px;">Kachel</span>
</sc-if>
</span>
</span>
<sc-if value="{{a.hatPunkte}}" hint-placeholder-val="{{ true }}">
<span style="flex-shrink: 0; font-size: 14px; font-weight: 700; color: #6B4A00; background: #FBE9B4; padding: 4px 10px; border-radius: 12px;">{{a.pkt}}</span>
</sc-if>
<svg width="18" height="18" viewBox="0 0 20 20" fill="none" stroke="#4A5558" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex-shrink: 0;"><path d="M7 4l6 6-6 6"></path></svg>
</a>
</sc-for>
</div>

<a href="NeueAufgabe.dc.html" style="margin-top: auto; min-height: 56px; display: flex; align-items: center; justify-content: center; border-radius: 16px; background: #1F5F5B; color: #ffffff; text-decoration: none; font-size: 18px; font-weight: 700;">+ Neue Aufgabe</a>

</main>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":1200}}'>
class Component extends DCLogic {
renderVals() {
const st = this.state || {};
const f = st.f || 'alle';
const roh = [
{ name: 'Tisch decken', wann: 'Jeden Mo, Mi, Fr', wer: 'Friederike', p: 1, art: 'regel', kachel: true },
{ name: 'Spülmaschine ausräumen', wann: 'Jeden Tag', wer: 'Kinder im Wechsel', p: 1, art: 'regel', kachel: true },
{ name: 'Blumen gießen', wann: 'Alle 3 Tage', wer: 'Friederike', p: 1, art: 'regel' },
{ name: 'Geburtstagstisch schmücken', wann: 'Heute', wer: 'Kinder', p: 2, art: 'einmal', sicht: 'Nur Kinder' },
{ name: 'Papiermüll rausstellen', wann: 'Mo, 21.9.', wer: 'Papa', p: 0, art: 'einmal' },
{ name: 'Altglas wegbringen', wann: 'Diese Woche', wer: 'Wer will', p: 1, art: 'einmal' },
{ name: 'Zimmer aufräumen', wann: 'Ohne Termin', wer: 'Wer will', p: 2, art: 'einmal', kachel: true },
{ name: 'Gartentor reparieren', wann: 'Geparkt', wer: 'Papa', p: 0, art: 'geparkt', sicht: 'Nur ich' }
];
const filter = [['alle', 'Alle'], ['regel', 'Regelmäßig'], ['einmal', 'Einmalig'], ['geparkt', 'Geparkt']].map((x) => {
const aktiv = f === x[0];
return { name: x[1], aktiv: aktiv, rand: aktiv ? '#1F5F5B' : '#8A8472', bg: aktiv ? '#1F5F5B' : '#ffffff', fg: aktiv ? '#ffffff' : '#1F2A2E', waehlen: () => this.setState({ f: x[0] }) };
});
const liste = roh.filter((a) => f === 'alle' || a.art === f).map((a) => ({
name: a.name, wann: a.wann, wer: a.wer,
hatSicht: !!a.sicht, sicht: a.sicht || '', kachel: !!a.kachel,
hatPunkte: a.p > 0, pkt: '+' + a.p
}));
return { filter: filter, liste: liste };
}
}
</script>
</body>
</html>
