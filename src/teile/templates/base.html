<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="theme-color" content="{{ farbe | default('#4a90d9') }}">
  <title>{% block title %}Portal{% endblock %} · 16schwaben.de</title>
  <link rel="manifest" href="/static/manifest.json">
  <link rel="apple-touch-icon" href="/static/icon-192.png">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --farbe: {{ farbe | default('#4a90d9') }};
      --st: env(safe-area-inset-top,    0px);
      --sb: env(safe-area-inset-bottom, 0px);
      --sl: env(safe-area-inset-left,   0px);
      --sr: env(safe-area-inset-right,  0px);
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #f5f5f7;
      min-height: 100dvh;
      padding-bottom: calc(70px + var(--sb));
      color: #1d1d1f;
    }
    .page-header {
      background: var(--farbe);
      color: #fff;
      padding: calc(20px + var(--st)) calc(20px + var(--sr)) 20px calc(20px + var(--sl));
    }
    .main { padding: 16px; }

    /* Bottom-Leiste mit ⌂ und ✨ */
    .bar {
      position: fixed; bottom: 0; left: 0; right: 0;
      background: rgba(255,255,255,.92);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border-top: 1px solid rgba(0,0,0,.08);
      display: flex; align-items: center; justify-content: space-between;
      padding: 8px calc(24px + var(--sr)) calc(8px + var(--sb)) calc(24px + var(--sl));
      z-index: 50;
    }
    .bar-btn {
      min-width: 48px; min-height: 48px;
      display: flex; align-items: center; justify-content: center;
      font-size: 26px; border: none; background: none;
      cursor: pointer; text-decoration: none; color: inherit;
      border-radius: 12px;
      -webkit-tap-highlight-color: transparent;
    }
    .bar-btn:active { background: rgba(0,0,0,.06); }

    /* ✨ Overlay */
    #wunsch-overlay {
      display: none; position: fixed; inset: 0;
      background: rgba(0,0,0,.45);
      align-items: flex-end; justify-content: center;
      z-index: 100;
    }
    #wunsch-overlay.open { display: flex; }
    .wunsch-card {
      background: #fff; border-radius: 20px 20px 0 0;
      padding: 20px 20px calc(20px + var(--sb));
      width: 100%; max-width: 500px;
    }
    .wunsch-card h3 { font-size: 17px; font-weight: 600; margin-bottom: 12px; }
    .wunsch-card textarea {
      width: 100%; border: 1.5px solid #d1d1d6;
      border-radius: 10px; padding: 10px 12px;
      font-size: 16px; font-family: inherit;
      resize: none; outline: none;
    }
    .wunsch-card textarea:focus { border-color: var(--farbe); }
    .wunsch-actions { display: flex; gap: 8px; margin-top: 12px; justify-content: flex-end; }
    .btn {
      padding: 10px 20px; border-radius: 10px;
      font-size: 15px; font-weight: 500; border: none; cursor: pointer;
    }
    .btn-secondary { background: #f2f2f7; color: #1d1d1f; }
    .btn-primary   { background: var(--farbe); color: #fff; }
    {% block extra_styles %}{% endblock %}
  </style>
</head>
<body>

{% block body %}{% endblock %}

<div class="bar">
  {% if token is defined and token %}
    <a class="bar-btn" href="/p/{{ token }}" title="Startseite">⌂</a>
  {% else %}
    <span class="bar-btn"></span>
  {% endif %}
  {% if token is defined and token %}
    <button class="bar-btn" id="wunsch-btn" title="Verbesserungswunsch">✨</button>
  {% else %}
    <span class="bar-btn"></span>
  {% endif %}
</div>

{% if token is defined and token %}
<div id="wunsch-overlay">
  <div class="wunsch-card">
    <h3>✨ Verbesserungswunsch</h3>
    <textarea id="wunsch-text" rows="4" placeholder="Was soll besser werden?"></textarea>
    <div class="wunsch-actions">
      <button class="btn btn-secondary" id="wunsch-cancel">Abbrechen</button>
      <button class="btn btn-primary"   id="wunsch-send">Senden</button>
    </div>
  </div>
</div>
<script>
(function(){
  const overlay = document.getElementById('wunsch-overlay');
  document.getElementById('wunsch-btn').addEventListener('click', () => overlay.classList.add('open'));
  document.getElementById('wunsch-cancel').addEventListener('click', () => overlay.classList.remove('open'));
  overlay.addEventListener('click', e => { if (e.target === overlay) overlay.classList.remove('open'); });
  document.getElementById('wunsch-send').addEventListener('click', async () => {
    const text = document.getElementById('wunsch-text').value.trim();
    if (!text) return;
    try {
      await fetch('/wunsch', {
        method: 'POST',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({ text, app: '{{ app_slug | default("") }}', token: '{{ token }}' })
      });
    } catch(e) {}
    overlay.classList.remove('open');
    document.getElementById('wunsch-text').value = '';
  });
})();
</script>
{% endif %}

{% block extra_scripts %}{% endblock %}
<script>
if ('serviceWorker' in navigator) {
  navigator.serviceWorker.register('/static/sw.js')
    .catch(e => console.warn('SW:', e));
}
</script>
</body>
</html>
