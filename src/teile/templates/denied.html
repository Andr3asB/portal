<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <title>Kein Zugang · 16schwaben.de</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #f5f5f7; color: #1d1d1f;
      min-height: 100dvh;
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      padding: 32px 24px;
      text-align: center;
    }
    .icon { font-size: 64px; margin-bottom: 16px; }
    h1 { font-size: 24px; font-weight: 700; margin-bottom: 10px; }
    p  { font-size: 16px; color: #6e6e73; line-height: 1.6; max-width: 300px; }
    .hint { margin-top: 24px; font-size: 14px; color: #aeaeb2; }
  </style>
</head>
<body>
{% if reason == 'landing' %}
  <div class="icon">🏠</div>
  <h1>Familienportal</h1>
  <p>Bitte öffne deinen persönlichen Link, den du von Andi bekommen hast.</p>
{% else %}
  <div class="icon">🔒</div>
  <h1>Kein Zugang</h1>
  <p>Dieser Link ist ungültig oder abgelaufen.<br>Bitte Andi um einen neuen Link.</p>
{% endif %}
<p class="hint">portal.16schwaben.de</p>
</body>
</html>
